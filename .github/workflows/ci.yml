name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Branch and PR policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR direction
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Pull request: $HEAD_REF -> $BASE_REF"
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Only 'dev' may open a PR into 'main'. Task branches must target 'dev'."
            exit 1
          fi
          echo "PR direction is valid."

      - name: Validate Jira branch naming
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "dev" ]; then
            echo "dev -> main promotion PR, naming check not applicable."
            exit 0
          fi
          pattern='^(feature|fix|chore|docs)/SCRUM-[0-9]+-[a-z0-9][a-z0-9._-]*$'
          if echo "$HEAD_REF" | grep -Eq "$pattern"; then
            echo "Branch name '$HEAD_REF' is valid."
          else
            echo "::error::Branch '$HEAD_REF' does not match the required pattern: $pattern"
            echo "Examples: feature/SCRUM-14-initial-ci, fix/SCRUM-31-course-delete-error"
            exit 1
          fi

  repo-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Required repository files exist
        run: |
          missing=0
          for f in README.md .gitignore .gitattributes .editorconfig .env.example .dockerignore; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          exit $missing

      - name: No tracked sensitive files
        run: |
          bad=$(git ls-files \
            | grep -E '(^|/)\.env$|(^|/)\.env\.[^/]+$|\.pem$|\.key$|credentials.*\.json$' \
            | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Git is tracking sensitive files. Remove them and rotate any leaked secrets:"
            echo "$bad"
            exit 1
          fi
          echo "No sensitive files are tracked."

      - name: No unresolved merge conflict markers
        run: |
          hits=$(git grep -nE '^(<{7}( |$)|={7}$|>{7}( |$))' -- . ':!*.md' || true)
          if [ -n "$hits" ]; then
            echo "::error::Unresolved merge conflict markers found:"
            echo "$hits"
            exit 1
          fi
          echo "No conflict markers found."

      - name: Workflow dependencies use immutable references
        shell: bash
        run: |
          invalid=0
          while IFS= read -r line; do
            reference=$(echo "$line" | sed -E 's/^[[:space:]]*uses:[[:space:]]*([^[:space:]#]+).*/\1/')

            if [[ "$reference" == ./* ]]; then
              continue
            fi
            if [[ "$reference" =~ ^docker://[^@]+@sha256:[0-9a-f]{64}$ ]]; then
              continue
            fi
            if [[ "$reference" =~ ^[^@]+@[0-9a-f]{40}$ ]]; then
              continue
            fi

            echo "::error::Workflow dependency is not pinned immutably: $reference"
            invalid=1
          done < <(grep -RhE '^[[:space:]]*uses:' .github/workflows || true)

          while IFS= read -r line; do
            reference=$(echo "$line" | sed -E 's/^[[:space:]]*image:[[:space:]]*([^[:space:]#]+).*/\1/')
            if [[ "$reference" =~ ^[^@]+@sha256:[0-9a-f]{64}$ ]]; then
              continue
            fi

            echo "::error::Workflow service image is not pinned immutably: $reference"
            invalid=1
          done < <(grep -RhE '^[[:space:]]*image:' .github/workflows || true)
          exit $invalid

      - name: Required .env.example keys present
        run: |
          missing=0
          for key in APP_ENV APP_DEBUG DEPLOYMENT_MODE DATABASE_URL AI_PROVIDER; do
            if ! grep -qE "^${key}=" .env.example; then
              echo "::error::.env.example is missing required key: $key"
              missing=1
            fi
          done
          exit $missing

      - name: Dependency files use UTF-8 compatible text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          invalid = []
          for name in (
              "requirements.in",
              "requirements.txt",
              "requirements-dev.in",
              "requirements-dev.txt",
          ):
              content = Path(name).read_bytes()
              if content.startswith((b"\xff\xfe", b"\xfe\xff")) or b"\x00" in content:
                  invalid.append(name)

          if invalid:
              raise SystemExit(
                  "Dependency files must be UTF-8 compatible text: "
                  + ", ".join(invalid)
              )
          PY

  backend-quality:
    name: Backend quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOYMENT_MODE: self_hosted
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Configure temporary directories
        run: |
          mkdir -p "$RUNNER_TEMP/lumina-chroma" "$RUNNER_TEMP/lumina-uploads"
          echo "CHROMA_PERSIST_DIRECTORY=$RUNNER_TEMP/lumina-chroma" >> "$GITHUB_ENV"
          echo "UPLOAD_DIRECTORY=$RUNNER_TEMP/lumina-uploads" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/pycache" >> "$GITHUB_ENV"
          echo "DATABASE_URL=sqlite:///$RUNNER_TEMP/lumina-ci.db" >> "$GITHUB_ENV"

      - name: Install locked backend dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --requirement requirements-dev.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Validate canonical migration layout and graph
        run: >-
          python -m pytest
          -q
          -p no:cacheprovider
          tests/test_migrations.py::test_alembic_uses_only_canonical_script_directory
          tests/test_migrations.py::test_migration_graph_has_one_canonical_base_and_head

      - name: Apply and verify database migrations
        env:
          APP_ENV: production
        run: |
          python -m alembic upgrade head
          python -m alembic current --check-heads
          python -m alembic check

      - name: Check document worker readiness
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          JWT_SECRET_KEY: ci-only-jwt-secret-at-least-32-characters
          BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          BOOTSTRAP_ADMIN_TOKEN: ci-only-bootstrap-token-at-least-32-characters
        run: python -m workers.document_processor --check

      - name: Import applications and build OpenAPI schemas
        run: |
          python - <<'PY'
          from backend.app import models
          from main import app
          from workers.document_processor import process_next_job

          assert models.Base.metadata.tables
          assert callable(process_next_job)
          app.openapi()
          print("Backend imports and OpenAPI generation succeeded")
          PY

      - name: Lint Python files
        run: python -m ruff check --no-cache .

      - name: Verify Python formatting
        run: python -m ruff format --check .

      - name: Compile all Python files
        run: git ls-files '*.py' | xargs -r python -m py_compile

      - name: Validate backend test collection
        run: python -m pytest --collect-only -q -p no:cacheprovider tests

      - name: Run backend tests
        run: >-
          python -m pytest
          -q
          -p no:cacheprovider
          --basetemp="$RUNNER_TEMP/pytest"
          tests

      - name: Tests leave the repository unchanged
        run: git diff --exit-code

  migration-governance:
    name: Migration governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: staging
      APP_DEBUG: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_DB: lumina_migration_ci
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Configure temporary storage
        run: |
          mkdir -p "$RUNNER_TEMP/lumina-chroma" "$RUNNER_TEMP/lumina-uploads"
          echo "CHROMA_PERSIST_DIRECTORY=$RUNNER_TEMP/lumina-chroma" >> "$GITHUB_ENV"
          echo "UPLOAD_DIRECTORY=$RUNNER_TEMP/lumina-uploads" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/pycache" >> "$GITHUB_ENV"

      - name: Install locked backend dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --requirement requirements-dev.txt

      - name: Validate canonical migration layout and graph
        run: >-
          python -m pytest
          -q
          -p no:cacheprovider
          tests/test_migrations.py::test_alembic_uses_only_canonical_script_directory
          tests/test_migrations.py::test_migration_graph_has_one_canonical_base_and_head

      - name: Exercise SQLite migration lifecycle
        env:
          DEPLOYMENT_MODE: self_hosted
          DATABASE_URL: sqlite:///${{ runner.temp }}/migration-governance.db
          STORAGE_BACKEND: local
        run: |
          python -m alembic upgrade head
          python -m alembic current --check-heads
          python -m alembic check
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current --check-heads
          python -m alembic check

      - name: Exercise PostgreSQL migration lifecycle
        env:
          DEPLOYMENT_MODE: hosted
          DATABASE_URL: postgresql+psycopg://lumina:lumina-ci-password@localhost:5432/lumina_migration_ci
          STORAGE_BACKEND: local
          STORAGE_NAMESPACE: migration-governance-ci
        run: |
          python -m alembic upgrade head
          python -m alembic current --check-heads
          python -m alembic check
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current --check-heads
          python -m alembic check

      - name: Migration checks leave the repository unchanged
        run: git diff --exit-code

  postgresql-quality:
    name: PostgreSQL quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: staging
      APP_DEBUG: "false"
      DEPLOYMENT_MODE: hosted
      DATABASE_URL: postgresql+psycopg://lumina:lumina-ci-password@localhost:5432/lumina_ci
      STORAGE_BACKEND: local
      STORAGE_NAMESPACE: postgresql-ci
      JWT_SECRET_KEY: ci-only-jwt-secret-at-least-32-characters
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_TOKEN: ci-only-bootstrap-token-at-least-32-characters
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_DB: lumina_ci
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Configure temporary storage
        run: |
          mkdir -p "$RUNNER_TEMP/lumina-chroma" "$RUNNER_TEMP/lumina-uploads"
          echo "CHROMA_PERSIST_DIRECTORY=$RUNNER_TEMP/lumina-chroma" >> "$GITHUB_ENV"
          echo "UPLOAD_DIRECTORY=$RUNNER_TEMP/lumina-uploads" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/pycache" >> "$GITHUB_ENV"

      - name: Install locked backend dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --requirement requirements-dev.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Run live PostgreSQL qualification
        run: >-
          python -m pytest
          -q
          -p no:cacheprovider
          --basetemp="$RUNNER_TEMP/pytest-postgresql"
          tests/test_postgresql.py

      - name: Run shared database contract on PostgreSQL
        run: >-
          python -m pytest
          -q
          -p no:cacheprovider
          --basetemp="$RUNNER_TEMP/pytest-postgresql-contract"
          -m database_contract
          tests

      - name: Check document worker readiness
        run: python -m workers.document_processor --check

      - name: PostgreSQL checks leave the repository unchanged
        run: git diff --exit-code

  container-quality:
    name: Container quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BACKEND_PORT: "18000"
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_TOKEN: ci-only-bootstrap-token-0123456789abcdef
      COMPOSE_PROJECT_NAME: lumina-ci-${{ github.run_id }}-${{ github.run_attempt }}
      JWT_SECRET_KEY: ci-only-jwt-secret-key-0123456789abcdef
      LUMINA_IMAGE: lumina:ci
      LUMINA_BACKUP_DIRECTORY: /tmp/lumina-backups-${{ github.run_id }}-${{ github.run_attempt }}
      STORAGE_NAMESPACE: container-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate immutable base and Compose configuration
        run: |
          set -euo pipefail
          mapfile -t references < <(
            awk 'toupper($1) == "FROM" {
              for (field = 2; field <= NF; field++) {
                if ($field !~ /^--/) {
                  print $field
                  next
                }
              }
            }' Dockerfile
          )
          if [ "${#references[@]}" -eq 0 ]; then
            echo "Dockerfile contains no base image." >&2
            exit 1
          fi
          for reference in "${references[@]}"; do
            if [[ ! "$reference" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "Docker base image is not pinned by digest: $reference" >&2
              exit 1
            fi
          done
          docker compose version
          docker compose config --quiet

      - name: Build production image
        run: docker build --pull --tag "$LUMINA_IMAGE" .

      - name: Validate image contract
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$LUMINA_IMAGE")" = "10001:10001"
          test "$(docker run --rm --entrypoint id "$LUMINA_IMAGE" -u)" = "10001"
          docker run --rm --entrypoint python "$LUMINA_IMAGE" -m pip check
          docker run --rm --entrypoint tesseract "$LUMINA_IMAGE" --version
          docker run --rm --entrypoint tesseract "$LUMINA_IMAGE" --list-langs | grep --line-regexp eng
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --entrypoint python "$LUMINA_IMAGE" -c '
          from pathlib import Path

          required = ("app/config.json", "app/messages.json", "alembic.ini", "main.py")
          excluded = (".env", ".git", "docs", "frontend", "tests", "requirements-dev.txt")
          assert all(Path("/app", path).is_file() for path in required)
          assert not any(Path("/app", path).exists() for path in excluded)
          assert not Path("/app").stat().st_mode & 0o222
          '

      - name: Exercise self-hosted topology
        run: |
          set -euo pipefail

          cleanup() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ]; then
              docker compose ps --all || true
              docker compose logs --no-color || true
              COMPOSE_PROJECT_NAME="$restore_project" docker compose ps --all || true
              COMPOSE_PROJECT_NAME="$restore_project" docker compose logs --no-color || true
            fi
            COMPOSE_PROJECT_NAME="$restore_project" docker compose down --volumes --remove-orphans || true
            docker compose down --volumes --remove-orphans || true
            exit "$result"
          }
          restore_project="${COMPOSE_PROJECT_NAME}-restore"
          trap cleanup EXIT

          docker compose up --detach --no-build --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:18000/health/ready

          migrate_id="$(docker compose ps --all --quiet migrate)"
          test "$(docker inspect --format '{{.State.Status}}' "$migrate_id")" = "exited"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migrate_id")" = "0"
          docker compose exec -T api sh -c 'test ! -w /app && test -w /data && test -w /tmp && test -f /data/lumina.db'
          test "$(docker compose exec -T api id -u | tr -d '\r')" = "10001"
          test "$(docker compose exec -T worker id -u | tr -d '\r')" = "10001"
          docker compose exec -T api python -c '
          import shutil

          from backend.app.config import settings
          from backend.app.request_size import MULTIPART_OVERHEAD_BYTES

          required = 2 * settings.max_concurrent_document_validations * (
              settings.max_upload_size_bytes + MULTIPART_OVERHEAD_BYTES
          )
          assert shutil.disk_usage("/tmp").total >= required
          '

          sudo install -d -o 10001 -g 10001 -m 0700 "$LUMINA_BACKUP_DIRECTORY"
          export BACKUP_ARCHIVE_NAME=lumina-ci-backup.tar.gz
          docker compose run --rm --no-deps \
            --env LUMINA_RESTART_SERVICES="api worker" migrate sh -c '
              umask 077
              printf "%s\n" "$LUMINA_RESTART_SERVICES" > /data/.lumina-backup-restart-services
            '
          docker compose stop api worker
          sudo mv "$LUMINA_BACKUP_DIRECTORY" "${LUMINA_BACKUP_DIRECTORY}.offline"
          set +e
          sh ops/self_hosted_backup.sh
          recovery_status=$?
          set -e
          test "$recovery_status" = "2"
          for service in api worker; do
            container_id="$(docker compose ps --quiet "$service")"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          done
          docker compose run --rm --no-deps migrate \
            test ! -f /data/.lumina-backup-restart-services
          sudo mv "${LUMINA_BACKUP_DIRECTORY}.offline" "$LUMINA_BACKUP_DIRECTORY"

          sh ops/self_hosted_backup.sh
          docker compose run --rm --no-deps migrate \
            test ! -f /data/.lumina-backup-restart-services
          sudo test -s "$LUMINA_BACKUP_DIRECTORY/$BACKUP_ARCHIVE_NAME"
          test "$(sudo stat -c '%a' "$LUMINA_BACKUP_DIRECTORY/$BACKUP_ARCHIVE_NAME")" = "600"
          curl --fail --silent --show-error http://127.0.0.1:18000/health/ready

          docker compose stop api worker
          test -z "$(docker compose ps --status running --services api worker)"
          COMPOSE_PROJECT_NAME="$restore_project" docker compose --profile maintenance run --rm restore
          COMPOSE_PROJECT_NAME="$restore_project" docker compose run --rm migrate
          COMPOSE_PROJECT_NAME="$restore_project" docker compose run --rm --no-deps worker \
            python -m workers.embedding_backfill --prune-orphans
          COMPOSE_PROJECT_NAME="$restore_project" docker compose up --detach --no-build --wait --wait-timeout 180 api worker
          curl --fail --silent --show-error http://127.0.0.1:18000/health/ready
          COMPOSE_PROJECT_NAME="$restore_project" docker compose down --volumes --remove-orphans

          docker compose start api worker
          for service in api worker; do
            container_id="$(docker compose ps --quiet "$service")"
            for _ in $(seq 1 60); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy" ]; then
                break
              fi
              sleep 2
            done
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          done
          curl --fail --silent --show-error http://127.0.0.1:18000/health/ready

      - name: Reject tracked-file mutations
        run: git diff --exit-code

  infrastructure-quality:
    name: Infrastructure quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TERRAFORM_VERSION: 1.12.2
      HASHICORP_RELEASE_KEY_FINGERPRINT: C874011F0AB405110D02105534365D9472D7468F
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Install verified Terraform
        run: |
          set -euo pipefail
          release="terraform_${TERRAFORM_VERSION}"
          release_url="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          install_dir="$RUNNER_TEMP/terraform-bin"
          mkdir -p "$install_dir" "$RUNNER_TEMP/terraform-download"
          curl --fail --location --silent --show-error \
            https://keybase.io/hashicorp/pgp_keys.asc \
            --output "$RUNNER_TEMP/terraform-download/hashicorp.asc"
          gpg --batch --import "$RUNNER_TEMP/terraform-download/hashicorp.asc"
          fingerprint="$(gpg --batch --show-keys --with-colons \
            "$RUNNER_TEMP/terraform-download/hashicorp.asc" \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$HASHICORP_RELEASE_KEY_FINGERPRINT"
          curl --fail --location --silent --show-error \
            "$release_url/${release}_SHA256SUMS" \
            --output "$RUNNER_TEMP/terraform-download/SHA256SUMS"
          curl --fail --location --silent --show-error \
            "$release_url/${release}_SHA256SUMS.sig" \
            --output "$RUNNER_TEMP/terraform-download/SHA256SUMS.sig"
          curl --fail --location --silent --show-error \
            "$release_url/${release}_linux_amd64.zip" \
            --output "$RUNNER_TEMP/terraform-download/terraform.zip"
          verification="$(gpg --batch --status-fd=1 --verify \
            "$RUNNER_TEMP/terraform-download/SHA256SUMS.sig" \
            "$RUNNER_TEMP/terraform-download/SHA256SUMS" 2>&1)"
          printf '%s\n' "$verification"
          signature_primary="$(printf '%s\n' "$verification" \
            | awk '/^\[GNUPG:\] VALIDSIG / { print $NF; exit }')"
          test "$signature_primary" = "$HASHICORP_RELEASE_KEY_FINGERPRINT"
          grep " ${release}_linux_amd64.zip$" \
            "$RUNNER_TEMP/terraform-download/SHA256SUMS" \
            | sed "s#${release}_linux_amd64.zip#terraform.zip#" \
            | (cd "$RUNNER_TEMP/terraform-download" && sha256sum --check -)
          unzip -q "$RUNNER_TEMP/terraform-download/terraform.zip" -d "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform without a backend
        run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Run Terraform tests
        run: |
          set -euo pipefail
          terraform -chdir=terraform test
          if [ -d terraform/modules ]; then
            mapfile -t module_directories < <(
              find terraform/modules -type f -name '*.tftest.hcl' -printf '%h\n' \
                | sort -u \
                | sed 's#/tests$##'
            )
            for index in "${!module_directories[@]}"; do
              module_directory="${module_directories[$index]}"
              module_data_dir="$RUNNER_TEMP/terraform-module-$index"
              TF_DATA_DIR="$module_data_dir" terraform -chdir="$module_directory" \
                init -backend=false -input=false -lockfile=readonly
              TF_DATA_DIR="$module_data_dir" terraform -chdir="$module_directory" validate
              TF_DATA_DIR="$module_data_dir" terraform -chdir="$module_directory" test
            done
          fi

      - name: Run CloudFront function tests
        run: |
          set -euo pipefail
          mapfile -t node_tests < <(
            find terraform -type f \
              \( -name '*.test.js' -o -name '*_test.js' -o \
                 -name '*.test.mjs' -o -name '*_test.mjs' -o \
                 -name '*.test.cjs' -o -name '*_test.cjs' \) \
              | sort
          )
          if [ "${#node_tests[@]}" -eq 0 ]; then
            echo "No Terraform CloudFront function tests are present yet."
          else
            node --test "${node_tests[@]}"
          fi

      - name: Infrastructure checks leave the repository unchanged
        run: git diff --exit-code

  frontend-quality:
    name: Frontend quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Build leaves tracked files unchanged
        working-directory: .
        run: git diff --exit-code

  frontend-e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Run the browser suite
        run: npm run test:e2e

      - name: Keep the report when the suite fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: End-to-end leaves tracked files unchanged
        working-directory: .
        run: git diff --exit-code
