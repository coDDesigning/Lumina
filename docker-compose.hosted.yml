# The hosted topology, reproduced locally: PostgreSQL with pgvector instead of
# SQLite and Chroma, and MinIO instead of the local filesystem. AWS runs the
# same image on ECS behind an ALB and CloudFront (see terraform/), so this file
# exists to exercise the hosted code paths on one machine, not to be deployed.
#
# Shaped like docker-compose.yml on purpose: one image, one published port, and
# .env as the only place configuration lives. See docs/deployment.md.
name: lumina-hosted

x-lumina: &lumina
  image: lumina
  build: .
  env_file: .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DEPLOYMENT_MODE: hosted
    DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/lumina
    VECTOR_BACKEND: pgvector
    STORAGE_BACKEND: s3
    S3_BUCKET: ${S3_BUCKET:-lumina}
    # The container-internal address of the MinIO service below. No browser
    # resolves it: every document is streamed through the API, which is why
    # nothing here ever mints a presigned URL.
    S3_ENDPOINT_URL: http://minio:9000
    S3_FORCE_PATH_STYLE: "true"
    EMBEDDING_MODEL_CACHE_DIRECTORY: /opt/lumina/embedding-models
    # Empty for the same reason as in docker-compose.yml: this file publishes
    # the container directly, with no proxy in front of it. AWS is the case
    # where a load balancer really is in front, and terraform/modules/ecs sets
    # this there.
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=${LUMINA_TMPFS_SIZE_BYTES:-268435456}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  init: true
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lumina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumina"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Not a Lumina image, so it gets no env_file and its credentials come from
  # interpolation. These two are the only variables this file still demands
  # outright: without them MinIO would start with defaults the API is not
  # configured for.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-lumina}
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        for attempt in $(seq 1 30); do
          if mc alias set lumina http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; then
            break
          fi
          sleep 1
        done
        mc alias set lumina http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "lumina/$$S3_BUCKET"
    restart: "no"

  migrate:
    <<: *lumina
    command:
      ["sh", "-c", "python -m alembic upgrade head && python -m alembic current --check-heads && python -m alembic check"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  lumina:
    <<: *lumina
    pull_policy: build
    ports:
      - "${LUMINA_BIND_ADDRESS:-127.0.0.1}:${LUMINA_PORT:-10312}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # MinIO has no shell, so it cannot declare a healthcheck. Readiness is
      # gated by the API's own probe, which writes and reads an object.
      minio:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 345s

  lumina-worker:
    <<: *lumina
    pull_policy: build
    command: ["python", "-m", "workers.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "workers.worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-345s}

volumes:
  pgdata:
  minio-data:
