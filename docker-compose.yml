name: ${COMPOSE_PROJECT_NAME:?set a stable COMPOSE_PROJECT_NAME in .env}

x-lumina-environment: &lumina-environment
  APP_ENV: production
  APP_DEBUG: "false"
  DEPLOYMENT_MODE: self_hosted
  DATABASE_URL: sqlite:////data/lumina.db
  CHROMA_PERSIST_DIRECTORY: /data/chroma
  UPLOAD_DIRECTORY: /data/uploads
  STORAGE_BACKEND: local
  STORAGE_NAMESPACE: ${STORAGE_NAMESPACE:-self-hosted}
  MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
  MAX_REQUEST_SIZE_BYTES: ${MAX_REQUEST_SIZE_BYTES:-1048576}
  MAX_CONCURRENT_DOCUMENT_VALIDATIONS: ${MAX_CONCURRENT_DOCUMENT_VALIDATIONS:-2}
  UPLOAD_REQUEST_TIMEOUT_SECONDS: ${UPLOAD_REQUEST_TIMEOUT_SECONDS:-300}
  MAX_DOCUMENTS_PER_COURSE: ${MAX_DOCUMENTS_PER_COURSE:-1000}
  MAX_COURSE_STORAGE_BYTES: ${MAX_COURSE_STORAGE_BYTES:-2147483648}
  MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
  MAX_PDF_PAGE_PIXELS: ${MAX_PDF_PAGE_PIXELS:-40000000}
  MAX_PDF_TOTAL_PIXELS: ${MAX_PDF_TOTAL_PIXELS:-100000000}
  MAX_PDF_CONTENT_STREAM_BYTES: ${MAX_PDF_CONTENT_STREAM_BYTES:-5242880}
  MAX_PDF_DRAWING_OPERATIONS: ${MAX_PDF_DRAWING_OPERATIONS:-100000}
  PROCESSING_JOB_LEASE_SECONDS: ${PROCESSING_JOB_LEASE_SECONDS:-60}
  PROCESSING_JOB_MAX_ATTEMPTS: ${PROCESSING_JOB_MAX_ATTEMPTS:-3}
  PROCESSING_JOB_POLL_SECONDS: ${PROCESSING_JOB_POLL_SECONDS:-1.0}
  PROCESSING_JOB_ATTEMPT_TIMEOUT_SECONDS: ${PROCESSING_JOB_ATTEMPT_TIMEOUT_SECONDS:-300}
  MAX_EXTRACTED_CHARACTERS: ${MAX_EXTRACTED_CHARACTERS:-2000000}
  MAX_DOCUMENT_CHUNKS: ${MAX_DOCUMENT_CHUNKS:-1000}
  OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
  OCR_DPI: ${OCR_DPI:-300}
  OCR_MIN_TEXT_CHARACTERS: ${OCR_MIN_TEXT_CHARACTERS:-20}
  DOCUMENT_CHUNK_SIZE_CHARACTERS: ${DOCUMENT_CHUNK_SIZE_CHARACTERS:-1200}
  DOCUMENT_CHUNK_OVERLAP_CHARACTERS: ${DOCUMENT_CHUNK_OVERLAP_CHARACTERS:-200}
  VECTOR_BACKEND: ${VECTOR_BACKEND:-chroma}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  AI_PROVIDER: ${AI_PROVIDER:-ollama}
  AI_FALLBACK_PROVIDERS: ${AI_FALLBACK_PROVIDERS:-}
  AI_GENERATION_TIMEOUT_SECONDS: ${AI_GENERATION_TIMEOUT_SECONDS:-60}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
  OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.2}
  OLLAMA_TOP_P: ${OLLAMA_TOP_P:-0.9}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
  OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-4096}
  OLLAMA_REPEAT_PENALTY: ${OLLAMA_REPEAT_PENALTY:-1.1}
  STUDY_GUIDE_MATERIAL_MAX_CHARS: ${STUDY_GUIDE_MATERIAL_MAX_CHARS:-120000}
  QUIZ_MATERIAL_MAX_CHARS: ${QUIZ_MATERIAL_MAX_CHARS:-120000}
  FLASHCARD_MATERIAL_MAX_CHARS: ${FLASHCARD_MATERIAL_MAX_CHARS:-120000}
  AI_TUTOR_MATERIAL_MAX_CHARS: ${AI_TUTOR_MATERIAL_MAX_CHARS:-120000}
  COURSE_QA_MATERIAL_MAX_CHARS: ${COURSE_QA_MATERIAL_MAX_CHARS:-120000}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  AI_MODEL_COST_RATES: "${AI_MODEL_COST_RATES:-}"
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}
  COURSE_PURGE_INTERVAL_SECONDS: ${COURSE_PURGE_INTERVAL_SECONDS:-3600}
  EMBEDDING_BACKFILL_INTERVAL_SECONDS: ${EMBEDDING_BACKFILL_INTERVAL_SECONDS:-3600}
  EMBEDDING_BACKFILL_BATCH_SIZE: ${EMBEDDING_BACKFILL_BATCH_SIZE:-64}
  EMBEDDING_BACKFILL_PRUNE_ORPHANS: ${EMBEDDING_BACKFILL_PRUNE_ORPHANS:-false}

x-lumina-service: &lumina-service
  image: ${LUMINA_IMAGE:-lumina:local}
  build:
    context: .
  user: "10001:10001"
  environment: *lumina-environment
  volumes:
    - lumina-data:/data
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=${LUMINA_TMPFS_SIZE_BYTES:-268435456}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  extra_hosts:
    - host.docker.internal:host-gateway
  pids_limit: 256

services:
  migrate:
    <<: *lumina-service
    environment:
      APP_ENV: production
      DEPLOYMENT_MODE: self_hosted
      DATABASE_URL: sqlite:////data/lumina.db
    command:
      ["sh", "-c", "python -m alembic upgrade head && python -m alembic current --check-heads && python -m alembic check"]
    restart: "no"

  api:
    <<: *lumina-service
    environment:
      <<: *lumina-environment
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:?set BOOTSTRAP_ADMIN_TOKEN in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    command:
      ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--limit-concurrency", "100", "--timeout-graceful-shutdown", "330", "--no-access-log"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    init: true
    stop_grace_period: 345s
    restart: unless-stopped

  worker:
    <<: *lumina-service
    environment:
      <<: *lumina-environment
      JWT_SECRET_KEY: worker-does-not-serve-authentication
      BOOTSTRAP_ADMIN_EMAIL: worker@example.com
      BOOTSTRAP_ADMIN_TOKEN: worker-does-not-accept-admin-bootstrap
    command: ["python", "-m", "workers.document_processor"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "workers.document_processor", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    init: true
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-345s}
    restart: unless-stopped

  backup:
    <<: *lumina-service
    profiles: ["maintenance"]
    environment:
      <<: *lumina-environment
      JWT_SECRET_KEY: maintenance-does-not-serve-authentication
      BOOTSTRAP_ADMIN_EMAIL: maintenance@example.com
      BOOTSTRAP_ADMIN_TOKEN: maintenance-does-not-accept-admin-bootstrap
      GEMINI_API_KEY: maintenance-does-not-call-ai-providers
    volumes:
      - lumina-data:/data
      - ${LUMINA_BACKUP_DIRECTORY:-./backups}:/backup
    command:
      ["python", "-m", "workers.self_hosted_backup", "backup", "/backup/${BACKUP_ARCHIVE_NAME:-lumina-backup.tar.gz}", "--archive-root", "/backup", "--include-chroma-offline"]
    restart: "no"

  restore:
    <<: *lumina-service
    profiles: ["maintenance"]
    environment:
      <<: *lumina-environment
      JWT_SECRET_KEY: maintenance-does-not-serve-authentication
      BOOTSTRAP_ADMIN_EMAIL: maintenance@example.com
      BOOTSTRAP_ADMIN_TOKEN: maintenance-does-not-accept-admin-bootstrap
      GEMINI_API_KEY: maintenance-does-not-call-ai-providers
    volumes:
      - lumina-data:/data
      - ${LUMINA_BACKUP_DIRECTORY:-./backups}:/backup:ro
    command:
      ["python", "-m", "workers.self_hosted_backup", "restore", "/backup/${BACKUP_ARCHIVE_NAME:-lumina-backup.tar.gz}", "--archive-root", "/backup"]
    restart: "no"

  course-purge:
    <<: *lumina-service
    profiles: ["maintenance"]
    environment:
      <<: *lumina-environment
      JWT_SECRET_KEY: maintenance-does-not-serve-authentication
      BOOTSTRAP_ADMIN_EMAIL: maintenance@example.com
      BOOTSTRAP_ADMIN_TOKEN: maintenance-does-not-accept-admin-bootstrap
      GEMINI_API_KEY: maintenance-does-not-call-ai-providers
    volumes:
      - lumina-data:/data
    command: ["python", "-m", "workers.course_purge"]
    restart: "no"

  embedding-backfill:
    <<: *lumina-service
    profiles: ["maintenance"]
    environment:
      <<: *lumina-environment
      JWT_SECRET_KEY: maintenance-does-not-serve-authentication
      BOOTSTRAP_ADMIN_EMAIL: maintenance@example.com
      BOOTSTRAP_ADMIN_TOKEN: maintenance-does-not-accept-admin-bootstrap
    volumes:
      - lumina-data:/data
    command: ["python", "-m", "workers.embedding_backfill"]
    restart: "no"

volumes:
  lumina-data:
