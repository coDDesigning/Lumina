# Lumina, self-hosted.
#
# Configuration lives in .env and nowhere else. Compose reads that file for the
# ${...} substitutions below and hands the same file to the containers as it
# stands, so a setting added there reaches the application without being
# repeated here. Only the values that must differ inside a container are
# restated under `environment:`, which always wins over `env_file`.
#
# COMPOSE_PROJECT_NAME in .env overrides the name below, and names the
# lumina-data volume with it.
name: lumina

x-lumina: &lumina
  image: lumina
  build: .
  env_file: .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DEPLOYMENT_MODE: self_hosted
    STORAGE_BACKEND: local
    # Four slashes: an absolute path inside the volume, not the relative path
    # a checkout uses.
    DATABASE_URL: sqlite:////data/lumina.db
    CHROMA_PERSIST_DIRECTORY: /data/chroma
    UPLOAD_DIRECTORY: /data/uploads
    # Baked into the image and read offline. A relative path from .env would
    # send fastembed looking in an empty directory under HF_HUB_OFFLINE=1 and
    # every embedding would fail at runtime.
    EMBEDDING_MODEL_CACHE_DIRECTORY: /opt/lumina/embedding-models
    # Empty unless .env says otherwise, and empty is the safe value: nothing
    # stands between a browser and this container, so no X-Forwarded-For is
    # believed and per-IP rate limits key on the real peer. Set it in .env only
    # to the address of a TLS reverse proxy you run yourself.
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
  user: "10001:10001"
  volumes:
    - lumina-data:/data
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=${LUMINA_TMPFS_SIZE_BYTES:-268435456}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  extra_hosts:
    - host.docker.internal:host-gateway
  pids_limit: 256
  init: true
  restart: unless-stopped

services:
  # Runs to completion before anything serves. Migrations are deliberately not
  # applied on startup: /health/ready refuses to report ready while the schema
  # is behind, so a failed migration blocks the deployment here instead of
  # producing a crash-looping application.
  migrate:
    <<: *lumina
    command:
      ["sh", "-c", "python -m alembic upgrade head && python -m alembic current --check-heads && python -m alembic check"]
    restart: "no"

  lumina:
    <<: *lumina
    # Rebuild before starting, so `docker compose up -d` after a `git pull`
    # cannot run yesterday's code from a stale image tag. A cached rebuild
    # takes a moment; `--no-build` skips it. Deliberately not on the one-shot
    # services: `docker compose run` has no --no-build to opt out with.
    pull_policy: build
    # The only published port, and the whole address. Change LUMINA_PORT alone
    # -- nothing needs rebuilding, because the interface calls /api on whatever
    # origin served it. 8000 is inside the container and is not configurable.
    ports:
      - "${LUMINA_BIND_ADDRESS:-127.0.0.1}:${LUMINA_PORT:-10312}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 345s

  lumina-worker:
    <<: *lumina
    pull_policy: build
    command: ["python", "-m", "workers.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "workers.worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-345s}

  # Run through ops/self_hosted_backup.sh, which stops the services first.
  # See docs/self-hosted-backup.md.
  backup:
    <<: *lumina
    profiles: ["maintenance"]
    volumes:
      - lumina-data:/data
      - ${LUMINA_BACKUP_DIRECTORY:-./backups}:/backup
    command:
      ["python", "-m", "workers.self_hosted_backup", "backup", "/backup/${BACKUP_ARCHIVE_NAME:-lumina-backup.tar.gz}", "--archive-root", "/backup", "--include-chroma-offline"]
    restart: "no"

  # Separate from backup because the archive is mounted read-only here: a
  # restore must not be able to write over the archive it is reading.
  restore:
    <<: *lumina
    profiles: ["maintenance"]
    volumes:
      - lumina-data:/data
      - ${LUMINA_BACKUP_DIRECTORY:-./backups}:/backup:ro
    command:
      ["python", "-m", "workers.self_hosted_backup", "restore", "/backup/${BACKUP_ARCHIVE_NAME:-lumina-backup.tar.gz}", "--archive-root", "/backup"]
    restart: "no"

volumes:
  lumina-data:
