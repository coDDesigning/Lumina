# Lumina self-hosted single-origin entrypoint.
#
# Installed as /etc/nginx/conf.d/default.conf, replacing the stock file so that
# only one server listens on 8080. It is included from the http{} block of the
# nginx-unprivileged image's own nginx.conf, which is deliberately left alone:
# that file already relocates the pid file and all five *_temp_path directives
# under /tmp, which is what lets this container run with a read-only root
# filesystem and a single tmpfs.
#
# The routing contract mirrors the hosted CloudFront distribution in
# terraform/modules/frontend/. Keep the two in step.

server_tokens off;

# Docker's embedded DNS, and it is mandatory because proxy_pass below resolves
# through a variable. With a literal hostname nginx resolves "api" once at
# startup and keeps that address forever, so every `docker compose up -d` that
# recreates the api container would leave this proxy serving 502s until it was
# restarted by hand. The variable defers resolution to request time.
resolver         127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

gzip            on;
gzip_vary       on;
# The hosted distribution compresses its API behaviours too. Safe here because
# authentication is a bearer token read from localStorage and never a cookie,
# so no credential rides along on a cross-site request.
gzip_proxied    any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types      application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root /usr/share/nginx/lumina;

    absolute_redirect off;

    client_header_timeout 15s;
    # Per successive read rather than a total. docs/deployment.md requires a
    # request-body timeout no greater than UPLOAD_REQUEST_TIMEOUT_SECONDS,
    # which the application bounds at 300.
    client_body_timeout   60s;
    send_timeout          60s;
    keepalive_timeout     65s;
    client_max_body_size  1m;

    set $lumina_api api:8000;

    # nginx's own body-size refusal keeps the JSON content type the frontend
    # error handling expects. Upstream refusals are untouched because
    # proxy_intercept_errors is off.
    error_page 413 = @request_too_large;

    location @request_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"detail":"Request body too large"}';
    }

    # Container liveness, answered by nginx itself. It deliberately does not
    # reach the API: ops/self_hosted_backup.sh stops api and worker for the
    # duration of every backup, and a probe that depended on them would report
    # this service unhealthy on a working proxy.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The application's operational probes live at the server root, so they are
    # aliased rather than proxied by prefix. Exact-match locations, so they take
    # precedence over the /api regex below. These are the same-origin health
    # endpoints the README and the container smoke tests use. They are reachable
    # only from the published bind address, which defaults to loopback; an
    # operator who exposes this container more widely should restrict them at
    # that edge, as docs/deployment.md requires.
    location = /api/health/live {
        include /etc/nginx/lumina-proxy-api.conf;
        proxy_pass http://$lumina_api/health/live;
    }

    location = /api/health/ready {
        include /etc/nginx/lumina-proxy-api.conf;
        proxy_pass http://$lumina_api/health/ready;
    }

    # Matches /api and everything beneath it, but not /apifoo, mirroring the
    # distribution's separate "/api" and "/api/*" behaviours. Declared before
    # the static-file regex so that /api/anything.json is never served from
    # disk.
    #
    # $request_uri, not $uri: the prefix must reach the application byte for
    # byte. backend/app/request_size.py recognises a document upload by
    # matching the path, so a proxy that stripped or rewrote /api would
    # silently reclassify a 50 MiB upload as an ordinary 1 MiB request.
    location ~ ^/api(/|$) {
        # Above MAX_UPLOAD_SIZE_BYTES plus MULTIPART_OVERHEAD_BYTES so that the
        # application stays authoritative for every size limit it publishes and
        # answers an oversized body with its own JSON envelope.
        client_max_body_size 56m;

        include /etc/nginx/lumina-proxy-api.conf;
        proxy_pass http://$lumina_api$request_uri;
    }

    # Content-hashed build output. The ^~ modifier beats every regex below, so
    # a missing hash is a real 404 and never the application shell: serving
    # HTML here would surface as a module MIME-type error in the browser
    # instead. Cache-Control carries no "always" so that a 404 is not cached.
    location ^~ /assets/ {
        include /etc/nginx/lumina-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any path whose final segment contains a dot is a request for a file, not
    # a client-side route. This is the nginx spelling of
    # finalSegment.includes(".") in terraform/modules/frontend/viewer_request.js.
    location ~ \.[^/]*$ {
        include /etc/nginx/lumina-security-headers.conf;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Everything else is a client-side route such as "/", "/dashboard" or
    # "/courses/1/progress", served unconditionally from the shell exactly as
    # the CloudFront viewer function rewrites without testing existence. There
    # is deliberately no error_page 404 /index.html anywhere in this file: a
    # distribution-wide fallback would turn API failures into HTML 200s.
    location / {
        # The distribution's default behaviour allows GET and HEAD only.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        include /etc/nginx/lumina-security-headers.conf;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }
}
