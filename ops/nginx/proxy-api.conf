# Shared by every location that reaches the API so they cannot drift apart.
#
# Deliberately contains no add_header. The application sets
# Content-Security-Policy, X-Frame-Options, X-Content-Type-Options and
# Referrer-Policy on every response it produces, including the ones its
# middleware returns before routing, and add_header would append a second
# value rather than replace the first.
proxy_http_version 1.1;

# $http_host rather than $host: it keeps the port the browser actually used, so
# a redirect the application builds from the request URL points back at this
# entrypoint. With $host, FastAPI's trailing-slash redirect for /api/courses
# would send the browser to port 80.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
# $remote_addr, not $proxy_add_x_forwarded_for: this proxy is the edge, and
# appending would keep whatever X-Forwarded-For the client sent. The API runs
# uvicorn with --proxy-headers, so a client-supplied value would become its
# rate-limit identity and make the per-IP login and registration limits
# trivially bypassable. Overwriting discards it. An operator who puts a further
# trusted proxy in front of this one, and wants the original client address
# preserved, must revisit this line together with FORWARDED_ALLOW_IPS.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;

proxy_connect_timeout 5s;
# 330s matches uvicorn's --timeout-graceful-shutdown and clears both
# UPLOAD_REQUEST_TIMEOUT_SECONDS and AI_GENERATION_OVERALL_TIMEOUT_SECONDS,
# each of which the application bounds at 300. The hosted edge uses 120s, which
# is too low here: the single-GPU Ollama profile in docs/ai_providers.md sets a
# 180s per-attempt generation timeout.
proxy_send_timeout 330s;
proxy_read_timeout 330s;

# This container has a read-only root filesystem and a small tmpfs, so nothing
# is spooled to disk in either direction.
proxy_buffering          on;
proxy_max_temp_file_size 0;
proxy_request_buffering  off;

# The application owns its error contract. nginx must never substitute a page
# for a status FastAPI produced, or an unknown /api route would stop being
# 404 application/json {"detail":"Not Found"}.
proxy_intercept_errors off;
