# Included by the static locations only. Never include this in an /api
# location: add_header appends rather than replaces, so a second policy here
# would sit beside the stricter default-src 'none' that
# backend/app/security_headers.py already attaches to every API response.
#
# Mirrors the CloudFront response-headers policy in
# terraform/modules/frontend/main.tf, minus the two directives that assume TLS.
# upgrade-insecure-requests is omitted for the same reason
# SECURITY_HSTS_ENABLED defaults to false in self-hosted Compose: on
# http://<lan-address>:8080 the browser would upgrade every same-origin
# subresource to https on a plain HTTP port and nothing would load. A TLS
# terminator placed in front of this container adds both directives itself.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://server.ethicalads.io https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; img-src 'self' data: blob: https://media.ethicalads.io https://server.ethicalads.io https://pagead2.googlesyndication.com https://tpc.googlesyndication.com; object-src 'none'; script-src 'self' https://media.ethicalads.io https://server.ethicalads.io https://pagead2.googlesyndication.com https://adservice.google.com https://www.googletagservices.com https://tpc.googlesyndication.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
